interface:
  display_name: "Planifier avec AgentVegan"
  short_description: "Calcule les repas de mon calendrier"
  default_prompt: "Utilise $planifier-agentvegan pour calculer seulement les repas de mon calendrier (par exemple un dîner par jour), avec les recettes du site en priorité."
dependencies:
  tools:
    - type: "mcp"
      value: "agentvegan"
      description: "Profil, calendrier de repas, repas flexibles, recettes sur mesure et courses AgentVegan"
      transport: "streamable_http"
      url: "https://mcp.agentvegan.org/mcp"
policy:
  allow_implicit_invocation: true
